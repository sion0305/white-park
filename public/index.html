<!doctype html>
<!--
  화이트 파크(White Park): 파일 하나로 돌아가는 3D 스키장

  실행 방법
    - 이 index.html 파일을 브라우저(크롬, 엣지, 사파리, 파이어폭스 최신판)로 열면 바로 시작돼요. 설치나 빌드는 필요 없어요.
    - three.js(0.128.0)는 importmap으로 jsDelivr CDN에서 불러오므로 처음 열 때 인터넷 연결이 필요해요.
    - 3D 모델, 이미지, 소리 파일은 하나도 쓰지 않아요. 모든 모델은 three.js 기본 도형(상자, 원기둥, 구, 원뿔, 도넛, 다면체, 평면)을 조합해 만들고,
      표지판 글씨와 눈 질감은 캔버스로 그리며, 배경음은 Web Audio로 합성해요.

  여럿이 함께 타기 (멀티플레이)
    - 함께 들어 있는 server.js(실시간 서버)가 이 파일을 띄우면, 같은 주소로 들어온 사람들끼리 서로 보이고
      같이 줄 서서 세 명씩 리프트와 곤돌라를 타요. 눈덩이, 눈사람, 천사 자국도 모두에게 보여요.
    - 이 파일을 다른 곳(정적 호스팅)에 따로 올렸다면 위쪽 <meta name="white-park-server">에 서버 주소(wss://.../ws)를 적어 주세요.
    - 주소 뒤에 ?ch=7 처럼 채널 번호를 붙이면 친구끼리 같은 채널에서 만날 수 있어요.
    - 파일을 컴퓨터에서 그냥 열거나 서버가 없으면 혼자 노는 모드예요. 손님 캐릭터, 리프트와 곤돌라, 눈놀이는 그대로 돼요.
    - claude.ai에 게시하면 서버 없이 claude.ai의 실시간 기능으로 함께 놀 수 있어요.
    - 이름, 꾸미기, 소리 설정과 시즌권 이용 기록은 브라우저 저장소(localStorage)에 남아요.

  코드 구성 (아래 모듈 스크립트 안, 위에서부터 순서대로)
    데이터와 꾸미기 규칙 → 지형 → 렌더러와 장면 → 하늘·산·나무·경계 펜스 → 로지·대여소·보관함·가로등 → 리프트와 곤돌라(정거장, 대기줄)
    → 캐릭터 모델과 자세 → 내 캐릭터 → 손님(NPC) 일정 → 눈 효과 → 눈놀이(굴리기, 던지기, 천사눈) → 서울 시간에 따른 낮밤
    → 로비(리프트권) 화면 → 멀티플레이(claude.ai 또는 자체 서버 연결) → 입력(캐릭터 끌어서 이동) → 행동과 화면 표시 → 시즌권과 방문 기록 → 물리(걷기, 줄서기, 리프트, 활강) → 지도 → 배경음 → 메인 루프
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Multiplayer server for the standalone page. Leave empty when server.js serves this page (it connects to the same address);
     fill in only if the page is hosted somewhere else, for example content="wss://white-park-server.example.com/ws". -->
<meta name="white-park-server" content="">
<title>화이트 파크 (White Park)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EAF0F7; --surface:#FFFFFF; --surface-2:#DDE6F1; --ink:#16202F; --ink-soft:#56627A; --line:rgba(22,32,47,.14);
  --primary:#2457C5; --primary-ink:#FFFFFF;
  --pass:#FFFFFF; --pass-ink:#16202F; --pass-soft:#5A6680; --pass-line:#D5DDE8; --pass-band:#2457C5;
  --hud-bg:rgba(14,21,36,.64); --hud-ink:#F4F7FB; --hud-line:rgba(255,255,255,.16);
  --font-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1524; --surface:#172136; --surface-2:#1F2B44; --ink:#E7EDF7; --ink-soft:#9AA7C0; --line:rgba(231,237,247,.13);
    --primary:#7FA6FF; --primary-ink:#0E1524;
    --pass:#F4F7FB; --pass-line:#CCD6E3;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1524; --surface:#172136; --surface-2:#1F2B44; --ink:#E7EDF7; --ink-soft:#9AA7C0; --line:rgba(231,237,247,.13);
  --primary:#7FA6FF; --primary-ink:#0E1524;
  --pass:#F4F7FB; --pass-line:#CCD6E3;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; background:#0B1430; }
*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
body{ margin:0; height:100%; overflow:hidden; background:#0B1430; color:var(--ink); font-family:var(--font-sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
button,input{ font:inherit; color:inherit; }
:focus-visible{ outline:2.5px solid #7FA6FF; outline-offset:2px; }
.vh{ position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

#stage{ position:relative; width:100%; height:100%; overflow:hidden; }
#world{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
body.in-world #world{ cursor:default; }
body.in-world #world.can-grab{ cursor:grab; }
body.in-world #world.grabbing{ cursor:grabbing; }

.glass{ background:var(--hud-bg); color:var(--hud-ink); border:0; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.hud-top{ position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:12px clamp(10px,3vw,20px); pointer-events:none; }
.hud-top > *{ pointer-events:auto; }
.place{ position:absolute; left:50%; top:6px; transform:translateX(-50%); border-radius:14px; padding:4px 14px 6px; text-align:center; max-width:min(44vw, 360px); pointer-events:none; }
/* the top HUD floats straight over the scene: no panels, just shadowed text and icons */
.hud-top .glass, .place.glass{ background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; text-shadow:0 1px 3px rgba(0,0,0,.6), 0 0 10px rgba(0,0,0,.3); }
.hud-top .icon-chip svg, .zoom button{ filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
#timeChip, #timePanel{ display:none !important; }
.loc-name{ margin:0; font-size:13.5px; font-weight:700; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.loc-sub{ margin:0; font-size:11.5px; line-height:1.3; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hud-left{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
.chip-row.left{ justify-content:flex-start; }
.icon-chip{ width:36px; padding:0; justify-content:center; }
.icon-chip svg{ width:18px; height:18px; }
.icon-chip[aria-pressed="false"] .wave, .icon-chip[aria-pressed="true"] .slash{ display:none; }
.loc-sub:empty{ display:none; }
.hud-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.chip-row{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.chip{ display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px; border-radius:999px; font-size:13.5px; white-space:nowrap; cursor:pointer; }
span.chip{ cursor:default; }
.mood{ font-size:12px; font-weight:700; padding:1px 8px; border-radius:999px; background:rgba(255,255,255,.18); }
.mood.preview{ background:#E8742C; color:#fff; }
#minimap{ width:128px; height:155px; border-radius:12px; background:transparent; }
.zoom{ display:flex; flex-direction:column; border-radius:12px; overflow:hidden; }
/* zoom buttons sit on the left edge, under the visitor count */
#zoomBox{ position:absolute; left:clamp(4px,2vw,14px); top:62px; pointer-events:auto; }
.zoom button{ width:44px; height:42px; border:0; background:transparent; color:var(--hud-ink); font-size:22px; font-weight:700; line-height:1; cursor:pointer; }
.zoom button + button{ border-top:0; }
.zoom button:disabled{ opacity:.35; cursor:default; }
.time-panel{ position:absolute; left:clamp(10px,3vw,20px); top:58px; width:min(340px, calc(100% - 20px)); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; font-size:14px; z-index:5; }
.time-panel .row{ display:flex; align-items:center; gap:10px; }
.time-panel input[type=range]{ flex:1; accent-color:#7FA6FF; }
.time-panel output{ min-width:76px; text-align:right; font-weight:600; }
.time-panel button{ align-self:flex-start; height:34px; padding:0 12px; border-radius:10px; border:1px solid var(--hud-line); background:transparent; color:var(--hud-ink); cursor:pointer; font-size:13px; }

.hud-bottom{ position:absolute; left:50%; bottom:18px; transform:translateX(-50%); width:min(600px, calc(100% - 24px)); display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.notice{ margin:0; border-radius:12px; padding:7px 14px; font-size:14px; text-align:center; }
.notice:empty{ display:none; }
.act-btn{ pointer-events:auto; display:inline-flex; align-items:center; gap:10px; height:54px; padding:0 26px; border-radius:999px; border:0; background:#2457C5; color:#fff; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.28); }
.act-btn.blocked{ background:#5A6680; }
.act-btn kbd{ font-family:inherit; font-size:12px; font-weight:700; padding:1px 7px; border-radius:6px; background:rgba(255,255,255,.22); }
.seatpick{ pointer-events:auto; display:flex; align-items:center; gap:6px; padding:6px 6px 6px 14px; border-radius:999px; background:var(--hud-bg); color:var(--hud-ink); border:1px solid var(--hud-line); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.seatpick-label{ font-size:13px; font-weight:700; margin-right:4px; }
.seatpick button{ height:38px; padding:0 14px; border-radius:999px; border:1px solid var(--hud-line); background:transparent; color:var(--hud-ink); font-size:14px; font-weight:700; cursor:pointer; }
.seatpick button[aria-pressed="true"]{ background:#F2C14B; color:#16202F; border-color:transparent; }
.seatpick button:disabled{ opacity:.35; cursor:default; text-decoration:line-through; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; pointer-events:auto; }
.tool-btn{ display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 14px; border-radius:999px; border:1px solid var(--hud-line); background:var(--hud-bg); color:var(--hud-ink); font-size:14px; font-weight:700; cursor:pointer; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.tool-btn kbd{ font-family:inherit; font-size:11.5px; font-weight:700; padding:0 6px; border-radius:5px; background:rgba(255,255,255,.2); }
.tool-btn[aria-pressed="true"]{ background:#F4F7FB; color:#16202F; }
.tool-btn[aria-pressed="true"] kbd{ background:rgba(22,32,47,.12); }
.tool-btn:disabled{ opacity:.4; cursor:default; }
.aim{ position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:2px solid rgba(255,255,255,.9); box-shadow:0 0 0 1px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.2); pointer-events:none; }
.aim::after{ content:""; position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px; border-radius:50%; background:#fff; }
#splat{ position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 1.6s ease-out; background:radial-gradient(circle at 32% 42%, rgba(255,255,255,.96) 0 8%, rgba(255,255,255,0) 13%), radial-gradient(circle at 60% 60%, rgba(255,255,255,.92) 0 6%, rgba(255,255,255,0) 11%), radial-gradient(circle at 47% 30%, rgba(255,255,255,.88) 0 5%, rgba(255,255,255,0) 9%), radial-gradient(circle at 70% 36%, rgba(255,255,255,.85) 0 3.5%, rgba(255,255,255,0) 7%), radial-gradient(circle at 24% 66%, rgba(255,255,255,.85) 0 3%, rgba(255,255,255,0) 6%); }
#splat.on{ opacity:1; transition:none; }
.hint{ margin:0; font-size:12.5px; color:var(--hud-ink); background:var(--hud-bg); border-radius:999px; padding:4px 12px; text-align:center; }
.hint:empty{ display:none; }
.joy{ position:absolute; left:clamp(12px,3vw,22px); bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); width:96px; height:96px; border-radius:50%; background:rgba(255,255,255,.16); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4); touch-action:none; z-index:3; -webkit-user-select:none; user-select:none; cursor:grab; }
.joy-knob{ position:absolute; left:50%; top:50%; width:42px; height:42px; margin:-21px 0 0 -21px; border-radius:50%; background:rgba(255,255,255,.85); box-shadow:0 2px 8px rgba(0,0,0,.3); pointer-events:none; }
.joy.on{ background:rgba(255,255,255,.24); cursor:grabbing; }
@media (pointer:coarse){ .joy{ bottom:calc(env(safe-area-inset-bottom, 0px) + 150px); width:92px; height:92px; } }
.drag-line{ position:absolute; height:4px; margin-top:-2px; border-radius:2px; background:rgba(255,255,255,.75); box-shadow:0 0 0 1px rgba(20,30,50,.25); transform-origin:0 50%; pointer-events:none; }
.drag-dot{ position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 0 0 3px rgba(36,87,197,.55); pointer-events:none; }
.drag-dot.start{ width:14px; height:14px; margin:-7px 0 0 -7px; background:rgba(255,255,255,.55); box-shadow:none; }
#flash{ position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 55%, rgba(255,255,255,.95), rgba(255,255,255,.55) 45%, rgba(255,255,255,0) 75%); opacity:0; transition:opacity .9s ease-out; }
#flash.on{ opacity:1; transition:none; }
.loading{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#fff; font-size:15px; }

/* lobby */
.lobby{ position:absolute; inset:0; overflow:auto; padding:clamp(14px,4vh,40px) clamp(12px,4vw,28px) 32px; background:linear-gradient(180deg, rgba(8,14,30,.05), rgba(8,14,30,.5)); }
.pass{ max-width:780px; margin:0 auto; background:var(--pass); color:var(--pass-ink); border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.3); }
.pass-band{ position:relative; border-radius:18px 18px 0 0; background:var(--pass-band); color:#fff; padding:22px 24px 18px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.pass-hole{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:56px; height:10px; border-radius:6px; background:rgba(8,14,30,.55); }
.pass-title{ margin:0; font-family:var(--font-display); font-weight:400; font-size:30px; line-height:1.15; }
.pass-season{ margin:0; font-size:14px; font-weight:600; opacity:.9; }
.pass-body{ display:grid; grid-template-columns:200px 1fr; gap:22px; padding:22px 24px 8px; }
.pass-photo{ background:linear-gradient(#CFE2F5,#EEF4FA); border-radius:14px; align-self:start; aspect-ratio:10/11; overflow:hidden; position:sticky; top:10px; z-index:2; }
.pass-photo canvas{ width:100%; height:100%; display:block; }
.pass-form{ display:flex; flex-direction:column; gap:15px; min-width:0; }
.look-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
.look-head .field-label{ margin:0; }
.pass-btn.small{ height:34px; padding:0 12px; font-size:13px; }
.look-rows{ display:flex; flex-direction:column; gap:6px; }
.gear-acc{ margin-top:10px; }
.acc{ border:1.5px solid var(--pass-line); border-radius:12px; background:#FAFBFD; }
.acc[open]{ border-color:var(--pass-band); }
.acc summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:8px 12px; min-height:44px; cursor:pointer; border-radius:12px; }
.acc summary::-webkit-details-marker{ display:none; }
.acc summary:focus-visible{ outline:2.5px solid var(--pass-band); outline-offset:2px; }
.acc-label{ font-size:13.5px; font-weight:700; width:58px; flex:none; color:var(--pass-ink); }
.acc-val{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; font-size:13.5px; color:var(--pass-soft); }
.acc-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.acc-dot{ width:20px; height:20px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
.acc-dot.none{ background:#FFFFFF; box-shadow:inset 0 0 0 1.5px #B9C3D2; position:relative; overflow:hidden; }
.acc-dot.none::after{ content:""; position:absolute; left:50%; top:-3px; width:2px; height:26px; background:#C0392B; transform:translateX(-50%) rotate(45deg); }
.acc-arrow{ width:16px; height:16px; flex:none; color:var(--pass-soft); transition:transform .2s; }
.acc[open] .acc-arrow{ transform:rotate(180deg); }
.acc-body{ padding:2px 12px 12px; display:flex; flex-direction:column; gap:10px; }
.seg{ display:inline-flex; align-self:flex-start; border:1.5px solid var(--pass-line); border-radius:10px; overflow:hidden; }
.seg-wrap{ position:relative; }
.seg-wrap input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
.seg-wrap span{ display:block; padding:7px 16px; font-size:13.5px; font-weight:600; }
.seg-wrap input:checked + span{ background:var(--pass-ink); color:var(--pass); }
.seg-wrap input:focus-visible + span{ outline:2.5px solid var(--pass-band); outline-offset:-3px; }
@media (prefers-reduced-motion: reduce){ .acc-arrow{ transition:none; } }
.look-row{ display:grid; grid-template-columns:52px 1fr; align-items:center; gap:8px; border:0; margin:0; padding:0; min-width:0; }
.gear-row{ margin-top:10px; grid-template-columns:62px 1fr; }
.row-label{ font-size:13px; font-weight:600; color:var(--pass-ink); padding:0; }
.swatches.sm{ gap:6px; }
.swatches.sm .sw{ width:26px; height:26px; }
.sw.none{ background:#FFFFFF; box-shadow:inset 0 0 0 1.5px #B9C3D2; position:relative; overflow:hidden; }
.sw.none::after{ content:""; position:absolute; left:50%; top:-3px; width:2px; height:32px; background:#C0392B; transform:translateX(-50%) rotate(45deg); }
.field{ border:0; margin:0; padding:0; min-width:0; }
.field-label{ display:block; font-size:13px; font-weight:700; color:var(--pass-soft); margin:0 0 8px; padding:0; }
.name-row{ display:flex; gap:8px; }
.name-row input{ flex:1; min-width:0; height:46px; border-radius:10px; border:1.5px solid var(--pass-line); background:#F7F9FC; color:var(--pass-ink); padding:0 12px; font-size:17px; }
.pass-btn{ height:46px; padding:0 14px; border-radius:10px; border:1.5px solid var(--pass-line); background:transparent; color:var(--pass-ink); cursor:pointer; white-space:nowrap; }
.equip{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.eq-wrap,.sw-wrap,.chip-wrap{ position:relative; }
.eq-wrap input,.sw-wrap input,.chip-wrap input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
.eq-tile{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px 8px; border-radius:12px; border:1.5px solid var(--pass-line); font-size:14px; font-weight:600; }
.eq-tile svg{ width:34px; height:28px; }
.eq-wrap input:checked + .eq-tile{ border:2px solid var(--pass-band); background:rgba(36,87,197,.08); padding:9px 5px 7px; }
.eq-wrap input:focus-visible + .eq-tile,.sw-wrap input:focus-visible + .sw,.chip-wrap input:focus-visible + .chip-pill{ outline:2.5px solid var(--pass-band); outline-offset:3px; }
.swatches,.chips{ display:flex; flex-wrap:wrap; gap:10px; }
.chips{ gap:8px; }
.sw{ display:block; width:32px; height:32px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
.sw-wrap input:checked + .sw{ outline:2.5px solid var(--pass-ink); outline-offset:2px; }

  const c = snd.ctx, sp = inWorld && (me.st === 'ski' || me.st === 'sled') ? me.speed : 0, alt = inWorld ? clamp(me.y / 110, 0, 1) : 0.3;

/* ===== main loop ===== */
let lastT = performance.now(), clockT = 0, mmT = 0, camSnap = true;
const camTarget = new THREE.Vector3(), camGoal = new THREE.Vector3();
let ftAvg = 16, ftTimer = 0;
function frame(nowP) {
  const raw = nowP - lastT, dt = Math.min(0.1, raw / 1000); lastT = nowP; clockT += dt;

  if (raw > 0 && raw < 250) ftAvg = lerp(ftAvg, raw, 0.05);

  if (ftTimer > 2.5) {
    ftTimer = 0;
    if (ftAvg > 24 && curDpr > 1) { curDpr = Math.max(1, curDpr - 0.25); renderer.setPixelRatio(curDpr); resize(); }
    else if (ftAvg < 14 && curDpr < DPR_CAP) { curDpr = Math.min(DPR_CAP, curDpr + 0.25); renderer.setPixelRatio(curDpr); resize(); }
  }
  const nowMs = Date.now();
  applyTime(false);
  updateLifts(nowMs);
  for (const n of npcs) updateNpc(n, nowMs);

  // others list for collisions
  others.length = 0;
  for (const n of npcs) others.push(n);
  const a = 1 - Math.exp(-dt * 10);
  for (const [, s] of peers) {
    if (Math.hypot(s.tx - s.x, s.tz - s.z) > 12 || Math.abs(s.ty - s.y) > 8) { s.x = s.tx; s.y = s.ty; s.z = s.tz; s.yaw = s.tyaw; }

    if (s.burst) { s.burst = false; burst(new THREE.Vector3(s.x, s.y, s.z)); }
    others.push({ x: s.x, y: s.y, z: s.z, st: s.st, name: s.av.tag ? s.sig.split('|')[0] : '' });
  }

  if (inWorld && myAv) {
    stepMe(dt, nowP, nowMs);
    sendPos(false);
    const fp = cam.mode === '1p';
    myAv.root.position.set(me.x, me.y, me.z); myAv.root.rotation.y = me.yaw + Math.PI;
    if (me.throwT != null) { me.throwT += dt / 0.6; if (!me.thrown && me.throwT >= 0.7) { me.thrown = true; releaseThrow(); } if (me.throwT >= 1) me.throwT = null; }
    const myPose = me.st === 'board' || me.st === 'enter' || (me.st === 'unload' && me.unload && me.unload.sled) ? 'walk' : me.st;
    poseAvatar(myAv, myPose, { sit: me.st === 'ski' && me.boardSit ? (me.standAt ? Math.max(0, 1 - (performance.now() - me.standAt) / 650) : 1) : 0, fp, gear: me.gear, dragSled: !!me.sledHeld && (me.st === 'walk' || me.st === 'carpet' || (me.st === 'unload' && !!me.unload && me.unload.sled)), t: clockT, speed: me.st === 'walk' || me.st === 'queue' || me.st === 'unload' || me.st === 'enter' ? me.walkSpeed : 0, turn: me.turn, sledArea: me.area === 's', slope: slopePitch(me.x, me.z, me.yaw), rolling: !!me.roll, throwP: me.throwT, angelT: me.angelT, inCabin: me.st === 'lift' && !!(me.liftKey && SLOPES[me.liftKey].gondola) });
    if (me.roll) { myBall.visible = true; rollBallPos(me.x, me.z, me.yaw, me.roll.r, myBall.position); myBall.scale.setScalar(me.roll.r); myBall.quaternion.copy(ballQ); } else myBall.visible = false;
    if (angelPreview) angelPreview.material.opacity = 0.85 * clamp(me.angelT / 3.5, 0, 1);
    myAv.bodyG.visible = !fp; myAv.passCard.visible = passWorn;
    if (myAv.tag) myAv.tag.visible = !fp;
    const glide = (me.st === 'walk' || me.st === 'queue') && !me.roll && me.throwT == null && me.gear === 'on';
    fpHands.visible = fp && equip === 'ski' && (me.st === 'ski' || me.st === 'unload' || (me.st === 'crash' && me.prevMode === 'ski') || glide);
    if (fpHands.visible) {
      if (glide) { const m = Math.min(1, me.walkSpeed / 2.5), sw = Math.sin(myAv.phase) * m; fpPoles[0].g.position.set(-0.36, -0.42 + sw * 0.04, -0.74 + sw * 0.16); fpPoles[1].g.position.set(0.36, -0.42 + sw * 0.04, -0.74 + sw * 0.16); }
      else { const sw = Math.sin(clockT * 2.5) * 0.03 * Math.min(1, me.speed / 8); fpPoles[0].g.position.set(-0.36, -0.42 + sw, -0.74); fpPoles[1].g.position.set(0.36, -0.42 - sw, -0.74); }
    }

      const px = s.ball.position.x, pz = s.ball.position.z;

// once the pass exists, the look and name are fixed: skip the ticket form and go straight to the pass

})();
