# Deploys the White Park server to Fly.io every time main is pushed (or by hand from the Actions tab).
# Needs one repository secret: FLY_API_TOKEN (from `fly tokens create deploy -x 999999h`).
name: Fly Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: fly-deploy        # never run two deploys at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
